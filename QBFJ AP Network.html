<meta charset="utf-8">
<title>清北复交 AP Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* --faint 只用于装饰性描边与占位符；凡是承载信息的小字一律用 --muted 起步，
   --faint 对白底只有 2.28:1。
   Deliberately single-theme. The four institution hues only clear the colour-vision
   checks inside the light lightness band; in a dark band 青 and 蓝 fall below the
   normal-vision floor. Investors are deliberately low-chroma — they have no school. */
:root{
  --sjtu:#AC312A;  --sjtu-d:#7E2320;
  --fudan:#244D9E; --fudan-d:#193874;
  --thu:#AD51A7;   --thu-d:#7E3A7A;
  --pku:#2CA6C0;   --pku-d:#1B7A8F;
  --inv:#877A5E;   --inv-d:#5E543F;
  --ground:#FCFBFA; --surface:#FFFFFF; --sunken:#F3F1EE;
  --ink:#191A1C; --ink-2:#474A4E; --muted:#787C81; --faint:#A8ACB1;
  --rule:#E4E3E0; --rule-2:#EFEEEB; --net:#F8F7F4;
  --shadow:0 1px 2px rgba(25,30,35,.05),0 12px 30px -16px rgba(25,30,35,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
:focus-visible{outline:2px solid var(--sjtu);outline-offset:2px;border-radius:2px}
.wrap{max-width:1520px;margin:0 auto;padding:0 22px}

header{padding:26px 0 16px}
h1{font-size:clamp(22px,2.8vw,30px);font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.25}
h1 .s{color:var(--sjtu)} h1 .f{color:var(--fudan)} h1 .t{color:var(--thu)} h1 .p{color:var(--pku)}
.kick{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-bottom:11px}
.find{max-width:64ch;font-size:14.5px;color:var(--ink-2);margin:11px 0 0}
.find b{color:var(--ink)}

.bar{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px;border:1px solid var(--rule);
  border-bottom:none;background:var(--surface);align-items:center}
.bar .lb{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 3px 0 10px;font-weight:600}
.bar .lb:first-child{margin-left:0}
.bar .sp{flex:1}
.chip{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:5px 11px;border:1px solid var(--rule);
  background:transparent;color:var(--ink-2);cursor:pointer;border-radius:2px;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip[data-v="s"][aria-pressed="true"]{background:var(--sjtu);border-color:var(--sjtu);color:#fff}
.chip[data-v="f"][aria-pressed="true"]{background:var(--fudan);border-color:var(--fudan);color:#fff}
.chip[data-v="t"][aria-pressed="true"]{background:var(--thu);border-color:var(--thu);color:#fff}
.chip[data-v="p"][aria-pressed="true"]{background:var(--pku);border-color:var(--pku);color:#fff}
.chip.inv[aria-pressed="true"]{background:var(--inv);border-color:var(--inv);color:#fff}
.chip.fs{border-color:var(--ink-2);color:var(--ink)}
.chip.zb{font-size:14px;padding:2px 10px 4px;line-height:1.2;min-width:32px}
.qwrap{display:flex;align-items:center;gap:7px}
.q{font-family:"IBM Plex Mono",ui-monospace,"Noto Sans SC",monospace;font-size:12px;
  padding:5px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  border-radius:2px;width:186px;outline:none;transition:border-color .12s}
.q::placeholder{color:var(--faint)}
.q:focus{border-color:var(--ink-2)}
.qn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  min-width:44px;font-variant-numeric:tabular-nums}
.qn.no{color:var(--sjtu)}


.hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);
  padding:7px 2px 0;line-height:1.6}

/* ---- 状态标签 / 视图切换 ---- */
.bar2{border-top:none}
.chip.hot[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.views{display:flex}
.views .chip{border-radius:0;margin-left:-1px}
.views .chip:first-child{border-radius:2px 0 0 2px}
.views .chip:last-child{border-radius:0 2px 2px 0}

/* ---- 表格视图 ---- */
.tw{border:1px solid var(--rule);background:var(--surface);overflow:auto;max-height:800px;
  overscroll-behavior:contain}
/* 抽屉打开时容器会变窄；给个下限让它横向滚动，而不是把列挤成一字一行。
   必须用 fixed 布局：auto 布局下浏览器会把可任意换行的中文列压到一字宽。 */
table.t{border-collapse:separate;border-spacing:0;width:100%;min-width:1020px;
  table-layout:fixed;font-size:13px;line-height:1.5}
.t col.c1{width:9.5%} .t col.c2{width:5%}  .t col.c3{width:14%} .t col.c4{width:24%}
.t col.c5{width:9.5%} .t col.c6{width:7%}  .t col.c7{width:19%} .t col.c8{width:12%}
.t th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:9px 11px;white-space:nowrap;
  border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
.t th:hover{color:var(--ink-2)}
.t th button.sb{all:unset;display:block;width:100%;cursor:pointer;font:inherit;color:inherit;
  letter-spacing:inherit;text-transform:inherit}
.t th button.sb:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.t th .ar{color:var(--ink);margin-left:3px}
.t th.nos{cursor:default} .t th.nos:hover{color:var(--faint)}
.t td{padding:9px 11px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--sunken)}
.t tbody tr[aria-current="true"] td{background:var(--sunken);box-shadow:inset 2px 0 0 var(--ink)}
.t tbody tr[data-mod] .nm::after{content:"已修改";font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:500;color:var(--muted);margin-left:6px;vertical-align:1px}
.t .nm{font-weight:700;color:var(--ink);white-space:nowrap}
.t .dt{color:var(--muted);font-size:11.5px;overflow-wrap:break-word}
.t .nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .rs{color:var(--ink-2);overflow-wrap:break-word}
.t .cc{min-width:12ch}
.t .cn{color:var(--ink);font-weight:500}
.t .em{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  white-space:nowrap;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.t .em a,.t .em button{color:inherit;background:none;border:none;padding:0;font:inherit;
  cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.t .em a:hover,.t .em button:hover{text-decoration-color:var(--ink-2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
  vertical-align:1px;flex:none}

/* 状态徽标：形状承载语义，不新增色相 */
.st{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  padding:1px 6px 2px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;border-radius:2px}
.st.growth{background:var(--sunken);border-color:var(--ink);color:var(--ink);font-weight:600}
.st.founded{border-color:var(--ink);color:var(--ink)}
.st.stealth{border-style:dashed;border-color:var(--muted)}
.st.potential{border-color:var(--rule);color:var(--muted)}
.st.hot{background:var(--ink);border-color:var(--ink);color:var(--ground);margin-left:4px}

/* 创业可能性：5 格刻度 */
.mt{display:inline-flex;gap:2px;vertical-align:-1px}
.mt i{width:5px;height:11px;background:var(--rule);display:block}
.mt i.on{background:var(--ink-2)}
.mt.s5 i.on{background:var(--ink)}

/* ---- 卡片视图 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule)}
/* 卡片是自足的：所有字段都在卡面上，不需要再点开抽屉。
   所以这里【故意】没有整卡点击 —— 跳图走卡片底部那个显式按钮。 */
.cd{background:var(--surface);padding:0 0 14px;display:flex;flex-direction:column}
.cd .bd{height:3px}
.cd .in{padding:12px 15px 0}
.cd .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cd .nm{font-size:17px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
.cd .ti{font-size:12px;color:var(--muted)}
.cd .dp{font-size:12px;color:var(--muted);margin-top:2px}
.cd .rs{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.cd .hn{font-size:11.5px;color:var(--muted);margin-top:5px;font-family:"IBM Plex Mono",monospace}
.cd .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;align-items:center}
.cd .co{border-top:1px solid var(--rule-2);margin:11px 15px 0;padding-top:9px}
.cd .co .cn{font-weight:700;font-size:13.5px;color:var(--ink)}
.cd .co .cr{font-size:11.5px;color:var(--muted)}
.cd .co .cf{font-size:11.5px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;
  margin-top:3px;line-height:1.55}
.cd .ct{margin:10px 15px 0;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.cd .ct a,.cd .ct button{color:inherit;background:none;border:none;padding:0;font:inherit;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.cd .ct a:hover,.cd .ct button:hover{text-decoration-color:var(--ink-2)}
.cd .wy{margin:9px 15px 0;font-size:11.5px;color:var(--muted);line-height:1.55;
  border-left:2px solid var(--rule);padding-left:8px}

.empty{padding:64px 22px;text-align:center;color:var(--muted);font-size:13.5px;
  border:1px solid var(--rule);border-top:none;background:var(--surface)}
.copied{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);
  color:var(--ground);font-family:"IBM Plex Mono",monospace;font-size:12px;padding:7px 14px;
  border-radius:2px;z-index:40;opacity:0;transition:opacity .18s;pointer-events:none}
.copied.on{opacity:1}

/* ---- 分层图：面包屑 / 学院下拉 ---- */
.crumb{position:absolute;left:12px;top:10px;z-index:4;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);pointer-events:none}
.crumb>*{pointer-events:auto}
.crumb button{font:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:3px 8px;
  color:var(--ink-2);cursor:pointer}
.crumb button:hover{border-color:var(--ink-2);color:var(--ink)}
.crumb b{color:var(--ink);font-weight:600;padding:3px 2px}
.crumb .sep{color:var(--faint)}
.crumb .up{padding:3px 7px}
.crumb .lv{color:var(--muted);margin-left:6px;pointer-events:none}
.dsel{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:5px 8px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink-2);border-radius:2px;max-width:220px}
.dsel:focus{outline:none;border-color:var(--ink-2)}
.mo-prof .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.mo-prof .peers a{margin-right:2px}
/* ---- 视图头 / 抽屉 ---- */
.vhd{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--rule);
  border-bottom:none;background:var(--surface)}
.vhd .sp{flex:1}
.vc{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
}

/* 面板绝对定位挂在 .sw 上（而不是 .stage），这样切到表格/卡片时它仍有盒子。
   但表格/卡片视图下，没选中人时它不该浮在内容上面 —— 只有变成抽屉(.dk)才出现。 */
.sw{position:relative}
.sw:fullscreen{background:var(--net)}
.sw:fullscreen .stage{height:100vh;border:none}
.sw:fullscreen .hint{display:none}
.stage{position:relative;height:800px;border:1px solid var(--rule);background:var(--net);overflow:hidden}
.cbox{position:absolute;inset:0}
#net{display:block;width:100%;max-width:100%;height:100%;cursor:grab;touch-action:none}
#net.drag{cursor:grabbing}
#net:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.stripe{height:3px;margin:-15px -17px 12px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:4px 8px;border-radius:2px;
  opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
footer{padding:16px 0 44px;color:var(--muted);font-size:12px;font-family:"IBM Plex Mono",monospace;line-height:1.85}
footer b{color:var(--ink-2)}
@media (max-width:1040px){
  /* 手机上画布矮一点，别占满一屏 */
  .stage{height:auto;overflow:visible;border:none;background:transparent}
  .cbox{position:relative;inset:auto;height:520px;border:1px solid var(--rule);background:var(--net)}
  .q{width:140px}
}

/* ---- 全屏详情 / 编辑弹层 ---- */
.mo{position:fixed;inset:0;z-index:60;display:flex;align-items:stretch;justify-content:center;
  opacity:0;transition:opacity .18s ease}
.mo.on{opacity:1}
.mo-bg{position:absolute;inset:0;background:rgba(25,26,28,.42)}
.mo-sh{position:relative;background:var(--surface);width:100%;display:flex;flex-direction:column;
  transform:translateY(14px);transition:transform .2s cubic-bezier(.2,.7,.2,1);box-shadow:var(--shadow)}
.mo.on .mo-sh{transform:none}
@media (min-width:760px){
  .mo{align-items:center;padding:3vh 22px}
  .mo-sh{width:min(820px,100%);max-height:94vh;border:1px solid var(--rule)}
}
.mo-hd{flex:none;position:relative;padding:14px 56px 12px 22px;border-bottom:1px solid var(--rule)}
.mo-hd .stripe2{position:absolute;left:0;right:0;top:0;height:3px}
.mo-hd .pk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.mo-hd h3{margin:3px 0 0;font-size:22px;font-weight:900;letter-spacing:-.01em;line-height:1.25}
.mo-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mo-x{position:absolute;right:12px;top:12px;width:34px;height:34px;border:1px solid var(--rule);
  background:var(--surface);border-radius:2px;cursor:pointer;font-size:15px;line-height:1;color:var(--ink-2)}
.mo-x:hover{border-color:var(--ink-2);color:var(--ink)}
.mo-bd{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:16px 22px 28px;font-size:14px;line-height:1.65}
.mo-prof .row{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule-2)}
.mo-prof .row .k{flex:none;width:56px;color:var(--muted);font-size:11.5px;font-family:"IBM Plex Mono",monospace;line-height:1.6}
.mo-prof .row .v{color:var(--ink-2);flex:1}
.mo-prof .sb{color:var(--muted);font-size:13px;margin-bottom:10px}
.mo-prof .pt{display:none}                         /* 快速标签行已把这行的信息展示了 */
.mo-prof .co{border-top:1px solid var(--rule);padding-top:11px;margin-top:11px}
.mo-prof .co .cn{font-weight:700;color:var(--ink);font-size:15.5px}
.mo-prof .co .cr{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.mo-prof .co .cf{font-size:13px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;line-height:1.6}
.mo-prof .co .ci{font-size:12.5px;color:var(--muted);margin-top:5px}
.mo-prof a.lk{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px;cursor:pointer}
.mo-prof a.lk:hover{text-decoration-color:var(--ink-2);color:var(--ink)}
.mo-prof .em a,.mo-prof .em button,.mo-prof .v a,.mo-prof .v button{color:inherit;background:none;border:none;padding:0;
  font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
body.mo-open{overflow:hidden}

/* 快速标签行：点一下即保存 */
.qt{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:0 0 14px;margin-bottom:12px;
  border-bottom:1px solid var(--rule)}
.qt-g{display:flex;align-items:center;gap:8px}
.qt .lb{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.qt-hint{font-size:11.5px;color:var(--muted);flex-basis:100%}
.seg{display:inline-flex}
.seg button{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:5px 11px;border:1px solid var(--rule);
  background:transparent;color:var(--ink-2);cursor:pointer;margin-left:-1px;transition:background .12s,color .12s}
.seg button:first-child{margin-left:0;border-radius:2px 0 0 2px}
.seg button:last-child{border-radius:0 2px 2px 0}
.seg button:hover{border-color:var(--muted);position:relative;z-index:1}
.seg button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);position:relative;z-index:1}
.seg[aria-label="score"] button{min-width:34px;text-align:center}
.seg.dis button{cursor:not-allowed;color:var(--faint);border-color:var(--rule-2)}
.seg.dis button[aria-checked="true"]{background:var(--muted);border-color:var(--muted);color:var(--ground)}

/* 编辑表单 */
.ed .ed-sec{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.ed .ed-sec:first-child{margin-top:0}
.ed .ed-hint{font-weight:400;letter-spacing:0;text-transform:none;font-family:inherit;font-size:11.5px;margin-left:8px}
.ed .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media (max-width:640px){.ed .grid{grid-template-columns:1fr}}
.ed .f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ed .f.wide{grid-column:1/-1}
.ed .f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;padding-top:18px}
.ed input,.ed select,.ed textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:2px;padding:7px 9px;width:100%;outline:none;transition:border-color .12s}
.ed input:focus,.ed select:focus,.ed textarea:focus{border-color:var(--ink-2)}
.ed input[disabled]{background:var(--sunken);color:var(--muted)}
.ed textarea{resize:vertical;line-height:1.5}
.ed input[type="checkbox"]{width:auto;margin:0}
.co-ed{border:1px solid var(--rule);padding:10px 12px 12px;margin-bottom:10px;background:var(--net)}
.co-ed-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.ed-err{color:var(--sjtu);font-size:13px;margin-top:12px;line-height:1.6}
.ed-err:empty{display:none}


/* 卡片：整卡可点，打开全屏详情 */
.cd{cursor:pointer;transition:background .12s}
.cd:hover{background:var(--sunken)}
.cd:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.cd .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);margin-left:auto}

/* 视图切换淡入 */
@keyframes vin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vin{animation:vin .16s ease-out}

/* 工具条右侧：同步状态 */
.sync{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);white-space:nowrap;
  padding:0 4px}
.sync.local{color:var(--sjtu)}
.sync:empty{display:none}

function assignIds(list){
  const seen=new Set(),dup=[];
  list.forEach(d=>{
    if(d._id&&d._id.indexOf("N:")===0){seen.add(d._id);return;}
    let key=pid(d),k=1;

}

const IALIAS={
  "国务院国资委诚通基金":"诚通基金","国家大基金系":"国家大基金",
  "北京市人工智能产业基金":"北京市人工智能基金","北京市人工智能产业投资基金":"北京市人工智能基金",
  "靖澄资本「港越一号」":"靖澄资本","高瓴创投":"高瓴","顺为":"顺为资本",
  "复旦科创基金":"复旦科创","华控基石基金":"华控基石"};

function build(){
  CO=new Map();INVM=new Map();BADSCH=[];
  DUP=assignIds(DB.filter(d=>SCH[d.sch]));
  DB.forEach(d=>{
    d.cos=d.cos||[]; delete d._h;
    if(!SCH[d.sch]){BADSCH.push(d.n+"（sch=\""+d.sch+"\"）");return;}
    d.cos.forEach(c=>{
      if(!c.name)return;
      if(!CO.has(c.name))CO.set(c.name,{name:c.name,fld:d.fld,profs:[],schools:[],inv:[]});
      const co=CO.get(c.name);
      co.profs.push({n:d.n,role:c.role,sch:d.sch,id:d._id});
      if(co.schools.indexOf(d.sch)<0)co.schools.push(d.sch);
      (c.inv||[]).forEach(x=>{if(co.inv.indexOf(x)<0)co.inv.push(x);});
    });
  });
  CO.forEach(co=>{co.inv=co.inv.map(x=>IALIAS[x]||x).filter((x,i,a)=>x&&a.indexOf(x)===i);});
  CO.forEach(co=>co.inv.forEach(name=>{
    if(!INVM.has(name))INVM.set(name,{lab:name,fund:!!SCHOOL_FUND[name],fundSch:SCHOOL_FUND[name]||null,cos:[],schools:[],flds:[]});
    const v=INVM.get(name); if(v.cos.indexOf(co)<0)v.cos.push(co);
    co.schools.forEach(k=>{if(v.schools.indexOf(k)<0)v.schools.push(k);});
    if(v.flds.indexOf(co.fld)<0)v.flds.push(co.fld);
  }));
  INVM.forEach(v=>{
    v.cross=v.schools.length>1; v.four=v.schools.length===4;
    v.corp=CORP.has(v.lab); v.state=STATE.has(v.lab);
    v.repeat=v.cos.length>1; v.alsoCo=CO.has(v.lab)?CO.get(v.lab):null;
    v.m=1.6+v.schools.length*0.55+(v.repeat?0.5:0);
  });
  CROSS=[...INVM.values()].filter(v=>v.cross).sort((a,b)=>b.schools.length-a.schools.length);
  FOUR=[...INVM.values()].filter(v=>v.four); XCO=[...CO.values()].filter(c=>c.schools.length>1);
  NINV=INVM.size;
  selfCheck(); renderStats();
}

/* ---- 数据自检 ---- */
const REQ=["n","sch","dept","title","research","fld","status"];
const OKF=Object.keys(FLD), OKS=Object.keys(STAT);
function checkRec(d){
  const m=REQ.filter(k=>!d[k]);
  if(d.fld&&OKF.indexOf(d.fld)<0)m.push('fld="'+d.fld+'" 不是 '+OKF.join("/"));
  if(d.status&&OKS.indexOf(d.status)<0)m.push('status="'+d.status+'" 不是 '+OKS.join("/"));
  if(d.score==null||d.score<1||d.score>5)m.push("score 必须是 1-5，现在是 "+d.score);
  const cos=d.cos||[];
  if(HASCO(d.status)&&!cos.length)m.push("创业/成长期项目却没填公司");
  if(d.status==="potential"&&cos.length)m.push("待创业却挂了公司（应为水下项目）");
  cos.forEach(c=>{
    if(!c.name)m.push("有一家公司没写名字");
    else if(!c.role)m.push('公司「'+c.name+'」没写角色');});
  return m;
}
function selfCheck(){
  BAD=DB.map(d=>({d,miss:checkRec(d)})).filter(x=>x.miss.length);
  if(BAD.length)console.warn("[数据自检] "+BAD.length+" 条记录有问题：\n"+
    BAD.map(x=>"  · "+x.d.n+" → "+x.miss.join("；")).join("\n"));
  if(BADSCH.length)console.error("[数据自检] "+BADSCH.length+" 条 sch 值非法，已整条跳过："+BADSCH.join("、"));
  if(DUP.length)console.warn("[数据自检] 同校重名 "+DUP.length+" 处："+[...new Set(DUP)].join("、")+" —— 已各自建独立节点，请确认确实是不同的人。");
  if(!BAD.length&&!BADSCH.length&&!DUP.length)console.info("[数据自检] "+DB.length+" 条记录全部通过。");
  const live=new Set(INVM.keys());
  const dead=[...CORP,...STATE,...Object.keys(SCHOOL_FUND)].filter(x=>!live.has(x));
  if(dead.length)console.warn("[数据自检] CORP/STATE/SCHOOL_FUND 里有 "+dead.length+" 个名字在 DB 中不存在："+dead.join("、"));
  const ns=[...live], pair=[];
  ns.forEach(a=>ns.forEach(b=>{if(a<b&&(a.indexOf(b)>=0||b.indexOf(a)>=0))pair.push(a+" / "+b);}));
  if(pair.length)console.info("[数据自检] 以下机构名互为子串，确认是否同一家（是的话加进 IALIAS）："+pair.join("；"));
}
function renderStats(){
  $("#foot").innerHTML=`收录教授 / AP <b>${DB.length}</b> 位（成长期 ${CNT("growth")} · 创业 ${CNT("founded")} · 水下 ${CNT("stealth")} · 待创业 ${CNT("potential")}）`
   +` · 公司 <b>${CO.size}</b> 家 · 机构 <b>${NINV}</b> 家 · 跨校机构 ${CROSS.length} 家。<br>`
   +`网络图按 <b>学校 › 学院 › 研究所 / AP</b> 逐层展开：学校与教授按归属着色（<b>交大红／复旦蓝／清华紫／北大青</b>），机构为低彩度沙色；`
   +`教授圆<b>实心带外圈 = 成长期（B 轮以后）、实心 = 创业项目（B 轮及之前）、中心点 = 水下项目（有项目无融资新闻）、空心 = 待创业</b>。`
   +`四院校色已按明度重新分级，使红绿色觉下最差色对 ΔE 达 8.3；本页只做亮色。<br>`
   +`<b>口径</b>：成长期 = B 轮以后；创业项目 = B 轮及之前且有融资新闻；水下 = 有项目但无融资新闻；待创业 = 尚未创业。`
   +`「高潜力」由维护者手动标注；「创业可能性」评分与「产业资本 / 国资」分类为本图自行判断，非官方口径。`
   +`联系方式只收院系官网公开的职务邮箱。数据来自本系列四校扫描报告与各院系官网名录（2026-08/09）。`
   +`页面内的增改会与同一组织内的其他查看者共享；「导出修改」可把改动导成 JSON 合回源文件。`;
}
document.getElementById("fldchips").outerHTML=Object.keys(FLD).map(k=>
  `<button class="chip" data-f="fld" data-v="${k}" aria-pressed="false">${FLDSHORT[k]}</button>`).join("");

/* ============ 分层图：学校 → 学院 → 研究所 / AP ============ */
const G={sch:null,dept:null};                 /* 当前层级：都为空 = 四校；只有 sch = 该校的学院；都有 = 该学院的人 */
const DEPTS=sch=>{const m=new Map();DB.forEach(d=>{if(d.sch!==sch)return;const k=DEPT(d);if(!m.has(k))m.set(k,[]);m.get(k).push(d);});
  return new Map([...m.entries()].sort((a,b)=>b[1].length-a[1].length));};
const stat=list=>({n:list.length,growth:list.filter(d=>d.status==="growth").length,
  founded:list.filter(d=>d.status==="founded").length,hot:list.filter(d=>d.hot).length});
const leadOf=list=>{const x=list.find(d=>d.lead);return x?x.lead:"";};
const SPINE={s:-1150,f:-385,t:385,p:1150};

function buildGraph(){
  N=[];L=[];byId=new Map();
  const add=o=>{if(byId.has(o.id))return byId.get(o.id);o.i=N.length;N.push(o);byId.set(o.id,o);return o;};
  if(!G.sch){                                                    /* L0：四校 */
    Object.keys(SCH).forEach(k=>add({id:"S:"+k,lab:SCH[k].n,type:"school",sch:k,m:11,
      cnt:stat(DB.filter(d=>d.sch===k)),anchor:SPINE[k],hub:1}));
    return;}
  if(!G.dept){                                                   /* L1：该校的学院 */
    const hub=add({id:"S:"+G.sch,lab:SCH[G.sch].n,type:"school",sch:G.sch,m:9,cnt:stat(DB.filter(d=>d.sch===G.sch)),anchor:0,hub:1});
    DEPTS(G.sch).forEach((ppl,dept)=>{
      const v=add({id:"D:"+dept,lab:dept,type:"dept",sch:G.sch,m:2.4+Math.sqrt(ppl.length)*0.9,cnt:stat(ppl),lead:leadOf(ppl),members:ppl});
      L.push({a:hub.i,b:v.i,k:"aff"});});
    return;}
  const ppl=DB.filter(d=>d.sch===G.sch&&DEPT(d)===G.dept);       /* L2：该学院的研究所 + AP */
  const grps=new Map(); ppl.forEach(d=>{const g=d.grp||"";if(!grps.has(g))grps.set(g,[]);grps.get(g).push(d);});
  const keys=[...grps.keys()].sort((a,b)=>grps.get(b).length-grps.get(a).length);
  /* 研究所多时排成网格（宽略大于高），否则 20 个 hub 排一行会变成 7000 宽的细条，fit 之后全是芝麻点 */
  const k=keys.length, cols=Math.max(1,Math.ceil(Math.sqrt(k*1.7))), rows=Math.ceil(k/cols);
  const gapX=k>1?Math.max(520,Math.min(760,2600/cols)):0, gapY=gapX*0.82;
  const hubs={};
  keys.forEach((g,idx)=>{const list=grps.get(g), c=idx%cols, r=Math.floor(idx/cols);
    hubs[g]=add({id:g?"G:"+g:"D:"+G.dept,lab:g||G.dept,type:g?"grp":"dept",sch:G.sch,
      m:3+Math.sqrt(list.length)*0.8,cnt:stat(list),lead:leadOf(list),members:list,
      anchor:(c-(cols-1)/2)*gapX,ay:(r-(rows-1)/2)*gapY,hub:1});});
  ppl.forEach(d=>{
    const p=add({id:d._id,lab:d.n,type:"prof",sch:d.sch,d,m:HASCO(d.status)?2.4:1.4,flds:[d.fld],hubOf:hubs[d.grp||""]});
    L.push({a:hubs[d.grp||""].i,b:p.i,k:"aff"});
    d.cos.forEach(c=>{const co=CO.get(c.name); if(!co)return;
      co.inv.forEach(name=>{const meta=INVM.get(name); if(!meta)return;
        const v=add(Object.assign({id:"I:"+name,type:"inv",sch:null,hubOf:p},meta));
        if(!L.some(l=>l.a===v.i&&l.b===p.i))L.push({a:v.i,b:p.i,k:"inv"});});});
  });
}

/* ============ layout：当前层级的力导向 ============ */
const LEN={aff:190,inv:160};
function step(al){
  for(let i=0;i<N.length;i++){const a=N[i];
    for(let j=i+1;j<N.length;j++){const b=N[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2<1e-4){dx=Math.random()-.5;dy=Math.random()-.5;d2=.25;}
      if(d2>2560000)continue;
      const d=Math.sqrt(d2),f=(2500*a.m*b.m)/d2*al/d;
      a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;}}
  L.forEach(l=>{const a=N[l.a],b=N[l.b];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,f=(d-LEN[l.k])*0.048*al/d;
    a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;});
  N.forEach(n=>{
    if(n.hub){n.vx+=(n.anchor-n.x)*0.13*al;n.vy+=((n.ay||0)-n.y)*0.13*al;}
    else{n.vx-=n.x*0.0011*al;n.vy-=n.y*0.0019*al;}
    if(n.pin){n.x=n.px;n.y=n.py;n.vx=n.vy=0;return;}
    n.vx*=.83;n.vy*=.83;
    const sp=Math.hypot(n.vx,n.vy); if(sp>20){n.vx*=20/sp;n.vy*=20/sp;}
    n.x+=n.vx;n.y+=n.vy;});
}
function layout(){
  N.forEach((n,i)=>{n.vx=0;n.vy=0;
    if(n.hub){n.x=n.anchor;n.y=n.ay||0;return;}
    const h=n.hubOf, a=i*2.399963, r=70+Math.sqrt(i)*22;
    n.x=(h?h.x:0)+Math.cos(a)*r; n.y=(h?h.y:0)+Math.sin(a)*r*0.8;});
  /* 每步是 O(N²)，315 点跑 1200 步实测 4.7s。按对数预算给步数，人多的层级少跑几步、用 alpha 衰减收住。 */
  const steps=Math.max(180,Math.min(1200,Math.round(2.2e7/(N.length*N.length))));
  for(let i=0;i<steps;i++)step(steps<1200?Math.max(.25,1-i/steps*.8):1);
  LAID=true;
}
let LAID=false;
build();
</script>

<script>
/* ============ view：分层网络图 ============ */
const cv=$("#net"),ctx=cv.getContext("2d"),tip=$("#tip"),stage=$("#stage"),cbox=$("#cbox"),sw=$("#sw"),crumb=$("#crumb");
let W=0,H=0,dpr=1,scale=1,ox=0,oy=0,hover=null,sel=null,drag=null,pan=null,press=null;
let fSch="all",fFld="all",showInv=false,fSt="all",fHot=false,fDept=null;
let fitScale=1,userView=false;
let QS="",hits=null;

/* 可见性：hub（学校/学院/研究所）永远可见；教授按赛道/状态/高潜力筛；机构只在 L2 且开关打开时跟着可见教授出现 */
let VP=new Set(),VI=new Set();
const inFilter=d=>(fFld==="all"||d.fld===fFld)&&(fSt==="all"||d.status===fSt)&&(!fHot||d.hot);
function recompute(){
  VP=new Set(); N.forEach(n=>{if(n.type==="prof"&&inFilter(n.d))VP.add(n.i);});
  VI=new Set(); if(showInv&&G.dept)L.forEach(l=>{if(l.k==="inv"&&VP.has(l.b))VI.add(l.a);});
}
function vis(n){
  if(n.type==="inv")return VI.has(n.i);
  if(n.type==="prof")return VP.has(n.i);
  return true;
}
const wide=()=>document.documentElement.clientWidth>1040;
const padR=()=>22;
function fit(){
  const v=N.filter(vis); if(!v.length)return;
  const xs=v.map(n=>n.x),ys=v.map(n=>n.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const padL=wide()?46:22, pR=padR(), padT=64, padB=56;     /* padT 给面包屑留位 */
  const aw=Math.max(120,W-padL-pR), ah=Math.max(120,H-padT-padB);
  scale=Math.min(aw/Math.max(1,x1-x0),ah/Math.max(1,y1-y0),1.9);
  ox=padL+aw/2-(x0+x1)/2*scale; oy=padT+ah/2-(y0+y1)/2*scale;
  fitScale=scale; userView=false;
}
const SX=n=>n.x*scale+ox, SY=n=>n.y*scale+oy;
const zf=()=>Math.min(2.2,Math.max(1,Math.pow(scale/(fitScale||1),.45)));
const rad=n=>zf()*(n.type==="school"?(G.sch?13:17)
  :n.type==="dept"?(G.dept?11:7+Math.sqrt(n.cnt.n)*1.6)
  :n.type==="grp"?8+Math.sqrt(n.cnt.n)*1.1
  :n.type==="prof"?6.2:3.6+n.schools.length*1.15+(n.repeat?1.0:0));
const neigh=n=>{const s=new Set([n.i]);L.forEach(l=>{if(l.a===n.i)s.add(l.b);if(l.b===n.i)s.add(l.a);});return s;};

/* ---------- zoom & pan ---------- */
function zoomAt(mx,my,k){
  const lo=Math.max(.12,fitScale*.65), hi=fitScale*9;
  const ns=Math.min(hi,Math.max(lo,scale*k)); if(Math.abs(ns-scale)<1e-6)return;
  const wx=(mx-ox)/scale, wy=(my-oy)/scale;
  scale=ns; ox=mx-wx*scale; oy=my-wy*scale; userView=true; draw();
}
function focusOn(n,minZ){
  if(minZ)scale=Math.max(scale,minZ);
  ox=(W-padR()+22)/2-n.x*scale; oy=H/2-n.y*scale; userView=true;
}
function nudgeIntoView(n){
  const x=SX(n),y=SY(n),lim=W-padR();
  if(x<40||x>lim-10||y<30||y>H-30)focusOn(n,0);
}

/* ---------- 层级导航 ---------- */
function syncSchChips(){$$('#bar .chip[data-f="sch"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fSch?"true":"false"));}
function renderDeptSel(){
  const el=$("#deptsel"); if(!el)return;
  if(fSch==="all"){el.hidden=true;el.innerHTML="";return;}
  const m=DEPTS(fSch); el.hidden=false;
  el.innerHTML=`<option value="">全部学院</option>`+[...m.entries()].map(([k,l])=>
    `<option value="${esc(k)}"${k===fDept?" selected":""}>${esc(k)}（${l.length}）</option>`).join("");
}
function renderCrumb(){
  const parts=[["四校",null,null]];
  if(G.sch)parts.push([SCH[G.sch].n,G.sch,null]);
  if(G.dept)parts.push([G.dept,G.sch,G.dept]);
  crumb.innerHTML=parts.map((p,i)=>i<parts.length-1
      ?`<button type="button" data-sch="${p[1]||""}" data-dept="${esc(p[2]||"")}">${esc(p[0])}</button><span class="sep">›</span>`
      :`<b>${esc(p[0])}</b>`).join("")
    +(G.sch?`<button type="button" class="up" data-up="1" title="上一级（Backspace）">↑</button>`:"")
    +`<span class="lv">${G.dept?"点教授开卡片 · 点研究所看成员":G.sch?"点学院展开":"点学校展开"}</span>`;
}
/* 进入某一层：同步筛选 chip / 学院下拉，重建并布局这一层 */
function drillTo(sch,dept){
  G.sch=sch||null; G.dept=(sch&&dept)||null;
  fSch=G.sch||"all"; fDept=G.dept;
  syncSchChips(); renderDeptSel();
  buildGraph(); layout(); recompute();
  sel=null;hover=null;hits=null;
  if(view==="net"){fit();draw();}
  renderCrumb();
  if(QS&&view==="net")runSearch($("#q").value);
}
const drillUp=()=>drillTo(G.dept?G.sch:null,null);
crumb.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.up)drillUp(); else drillTo(b.dataset.sch||null,b.dataset.dept||null);
});
/* 按 id 定位到图上的任意对象：教授 / 机构 / 学校 / 学院 —— 需要就先钻到对应层级 */
function goToId(id){
  if(!id)return;
  if(id.startsWith("S:")){if(view!=="net")setView("net");drillTo(id.slice(2),null);return;}
  if(id.startsWith("D:")){if(view!=="net")setView("net");drillTo(G.sch||fSch,id.slice(2));return;}
  let d=null,invName=null;
  if(id.startsWith("I:")){invName=id.slice(2);const meta=INVM.get(invName);if(!meta)return;
    const f=meta.cos[0]&&meta.cos[0].profs[0]; if(!f)return; d=DB.find(x=>x._id===f.id);}
  else d=DB.find(x=>x._id===id);
  if(!d)return;
  if(view!=="net")setView("net");
  if(G.sch!==d.sch||G.dept!==DEPT(d))drillTo(d.sch,DEPT(d));
  if(invName&&!showInv){showInv=true;const c=$("#bar .chip.inv");if(c)c.setAttribute("aria-pressed","true");recompute();}
  if(!inFilter(d)){
    fFld="all";fSt="all";fHot=false;
    $$('#bar .chip[data-f="fld"],#bar2 .chip[data-f]').forEach(b=>b.setAttribute("aria-pressed",
      b.dataset.f==="hot"?"false":(b.dataset.v==="all"?"true":"false")));
    recompute();}
  const n=byId.get(invName?"I:"+invName:d._id); if(!n)return;
  sel=n;hover=null;focusOn(n,Math.max(scale,fitScale*1.15));draw();
}
function goTo(n){goToId(n.id);}

/* ---------- search ---------- */
const norm=s=>String(s).toLowerCase().replace(/\s+/g,"");
function hay(n){
  if(n._h)return n._h;
  if(n.type==="prof")return n._h=dHay(n.d);
  const a=[n.lab];
  if(n.type==="inv")n.cos.forEach(c=>a.push(c.name));
  if(n.type==="school")a.push(SCH[n.sch].g);
  if(n.type==="dept"||n.type==="grp"){if(n.lead)a.push(n.lead);(n.members||[]).forEach(d=>a.push(d.n));}
  return n._h=norm(a.join(" "));
}
function runSearch(q){
  QS=norm(q);
  const qn=$("#qn");
  if(!QS){hits=null;qn.textContent="";qn.classList.remove("no");draw();return;}
  const set=new Set();
  N.forEach(n=>{if(vis(n)&&hay(n).indexOf(QS)>=0)set.add(n.i);});
  hits=set;
  const elsewhere=DB.filter(d=>dHay(d).indexOf(QS)>=0&&!(G.sch&&d.sch===G.sch&&(!G.dept||DEPT(d)===G.dept))).length;
  qn.textContent=set.size?set.size+" 项"+(elsewhere?"（其他层级另有 "+elsewhere+"）":""):(elsewhere?"本层无 · 其他层级 "+elsewhere+" 人":"无匹配");
  qn.classList.toggle("no",!set.size&&!elsewhere);
  draw();
}
function bestHit(){
  if(!hits||!hits.size)return null;
  const rank=n=>{const l=norm(n.lab),i=l.indexOf(QS);
    return i===0?(l.length===QS.length?0:1):(i>0?2:3);};
  return [...hits].map(i=>N[i]).sort((a,b)=>rank(a)-rank(b)||b.m-a.m)[0];
}

/* ---------- draw ---------- */
function draw(){
  const p=pal();
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const foc=hover||sel, near=foc?neigh(foc):null;
  const shown=new Set(N.filter(vis).map(n=>n.i));
  if(!shown.size){
    ctx.fillStyle=p.muted;ctx.textAlign="center";
    ctx.font='500 14px "Noto Sans SC",system-ui,sans-serif';
    ctx.fillText("没有符合当前筛选的教授。",(W-padR()+22)/2,H/2);
    ctx.textAlign="left";return;}
  const lit=n=>!hits||hits.has(n.i);

  L.forEach(l=>{
    if(!shown.has(l.a)||!shown.has(l.b))return;
    const a=N[l.a],b=N[l.b],on=(!near||(near.has(l.a)&&near.has(l.b)))&&(lit(a)||lit(b));
    const k=b.sch||a.sch;
    ctx.strokeStyle=k?SC(k):p.inv;
    ctx.globalAlpha=on?(l.k==="aff"?.28:.20):.045;
    ctx.lineWidth=l.k==="aff"?1.0:(a.cross?1.3:.9);
    ctx.beginPath();ctx.moveTo(SX(a),SY(a));ctx.lineTo(SX(b),SY(b));ctx.stroke();});
  ctx.globalAlpha=1;

  const drawn=[];
  N.forEach(n=>{
    if(!shown.has(n.i))return;
    const on=(!near||near.has(n.i))&&lit(n), x=SX(n),y=SY(n),r=rad(n);
    ctx.globalAlpha=on?1:.13;
    if(n.type==="school"||n.type==="dept"){
      ctx.fillStyle=SC(n.sch);ctx.strokeStyle=SD(n.sch);ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.stroke();
      if(n.type==="dept"&&!G.dept){                   /* 学院：中间标人数 */
        ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.font=`600 ${Math.max(9,Math.min(13,r*.55))}px "IBM Plex Mono",monospace`;
        ctx.fillText(n.cnt.n,x,y+.5);ctx.textAlign="left";ctx.textBaseline="alphabetic";}
    }else if(n.type==="grp"){
      ctx.fillStyle=p.bg;ctx.strokeStyle=SC(n.sch);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.stroke();
      ctx.fillStyle=SC(n.sch);ctx.beginPath();ctx.arc(x,y,r*.38,0,6.2832);ctx.fill();
    }else if(n.type==="prof"){
      const st=n.d.status, solid=HASCO(st);
      ctx.fillStyle=solid?SC(n.sch):p.bg;
      ctx.strokeStyle=st==="potential"?SC(n.sch):SD(n.sch);
      ctx.lineWidth=solid?1.1:1.4;
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.stroke();
      if(st==="stealth"){ctx.fillStyle=SC(n.sch);ctx.beginPath();ctx.arc(x,y,r*.45,0,6.2832);ctx.fill();}
      if(st==="growth"){ctx.strokeStyle=SD(n.sch);ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r+3,0,6.2832);ctx.stroke();}
      if(n.d.hot){ctx.fillStyle=p.ink;ctx.beginPath();ctx.arc(x+r*.75,y-r*.75,Math.max(1.6,r*.32),0,6.2832);ctx.fill();}   /* 高潜力：右上角小黑点 */
    }else{
      ctx.fillStyle=n.fund?p.bg:p.inv;ctx.strokeStyle=p.invd;ctx.lineWidth=n.fund?1.8:1;
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.stroke();
      if(n.four){ctx.strokeStyle=p.ink;ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(x,y,r+4.2,0,6.2832);ctx.stroke();}
    }
    if(hits&&hits.has(n.i)){ctx.globalAlpha=1;ctx.strokeStyle=p.ink;ctx.lineWidth=1.2;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.arc(x,y,r+5,0,6.2832);ctx.stroke();ctx.setLineDash([]);}
    if(foc&&foc.i===n.i){ctx.globalAlpha=1;ctx.strokeStyle=p.ink;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(x,y,r+6.5,0,6.2832);ctx.stroke();}
    drawn.push({n,x,y,r,on});});
  ctx.globalAlpha=1;

  /* 标签：hub 优先且必画（两行：名字 + 人数/创业数），教授/机构按空间避让 */
  const boxes=[],prio={school:0,dept:0,grp:0,inv:2,prof:3};
  drawn.sort((a,b)=>{const pa=a.n.four?1:prio[a.n.type],pb=b.n.four?1:prio[b.n.type];return (pa-pb)||(b.n.m-a.n.m);});
  drawn.forEach(({n,x,y,r,on})=>{
    if(!on)return;
    const hub=n.type==="school"||n.type==="dept"||n.type==="grp";
    if(n.type==="inv"&&!n.cross&&!n.fund&&!(near&&near.has(n.i))&&!(hits&&hits.has(n.i)))return;
    if(n.type==="prof"&&!HASCO(n.d.status)&&!n.d.hot&&!(near&&near.has(n.i))&&!(hits&&hits.has(n.i))&&zf()<1.35&&N.length>60)return;  /* 人多时待创业不标名，放大或悬停再显 */
    ctx.font=`${hub?600:500} ${hub?12.5:11}px "IBM Plex Mono","Noto Sans SC",monospace`;
    const w=ctx.measureText(n.lab).width,h=hub?13.5:11.8;
    const lx=x-w/2, ly=y+r+9, rightLim=W-2;
    if(!hub){
      if(ly+h>H-3||lx<2||lx+w>rightLim)return;
      if(boxes.some(b=>!(lx>b.x+b.w+3||lx+w+3<b.x||ly>b.y+b.h+2||ly+h+2<b.y)))return;}
    boxes.push({x:lx,y:ly,w,h:hub?h+13:h});
    ctx.lineWidth=3.4;ctx.strokeStyle=p.bg;ctx.lineJoin="round";
    ctx.strokeText(n.lab,lx,ly+h-3);
    ctx.fillStyle=hub?p.ink:(n.type==="inv"?(n.cross?p.ink:p.muted):p.ink2);
    ctx.fillText(n.lab,lx,ly+h-3);
    if(hub&&n.cnt){
      const sub=`${n.cnt.n} 人`+((n.cnt.growth+n.cnt.founded)?` · 创业 ${n.cnt.growth+n.cnt.founded}`:"")+(n.cnt.hot?` · 高潜 ${n.cnt.hot}`:"");
      ctx.font='500 10.5px "IBM Plex Mono",monospace';
      const sw2=ctx.measureText(sub).width;
      ctx.strokeText(sub,x-sw2/2,ly+h+10);ctx.fillStyle=p.muted;ctx.fillText(sub,x-sw2/2,ly+h+10);
    }});
}

/* ============ panel ============ */
const SV={s:"var(--sjtu)",f:"var(--fudan)",t:"var(--thu)",p:"var(--pku)"};
/* ============ 表格 / 卡片视图（与网络图共用同一套筛选条件） ============ */
let view="net", sortK="score", sortD=-1;

const dotOf=k=>`<i class="dot" style="background:${SV[k]}"></i>`;
const meter=v=>`<span class="mt${v>=5?" s5":""}" role="img" title="创业可能性 ${v}/5" aria-label="创业可能性 ${v} 分，满分 5 分">`
  +[1,2,3,4,5].map(i=>`<i class="${i<=v?"on":""}"></i>`).join("")+`</span>`;
const badge=d=>`<span class="st ${d.status}">${STAT[d.status]}</span>`
  +(d.hot?`<span class="st hot">高潜力</span>`:"");
const mailCell=d=>{
  const bits=[];
  if(d.email)bits.push(`<button type="button" data-cp="${esc(d.email)}" title="点击复制邮箱">${esc(d.email)}</button>`);
  if(d.home)bits.push(`<a href="${esc(d.home)}" target="_blank" rel="noopener noreferrer">主页 ↗</a>`);
  return bits.length?bits.join(" · "):`<span style="color:var(--faint)">—</span>`;
};
const dHay=d=>d._h||(d._h=norm([d.n,d.dept,d.title,d.research,d.honor,d.email,FLD[d.fld],
  STAT[d.status],d.hot?"高潜力":"",d.note,d.why,
  ...d.cos.flatMap(c=>[c.name,c.role,c.stage,c.fin,...(c.inv||[])])].join(" ")));

/* 三视图共用：一条记录是否通过当前筛选 */
function matchProf(d){
  if(fSch!=="all"&&d.sch!==fSch)return false;
  if(fFld!=="all"&&d.fld!==fFld)return false;
  if(fSt!=="all"&&d.status!==fSt)return false;
  if(fHot&&!d.hot)return false;
  if(fDept&&DEPT(d)!==fDept)return false;
  if(QS&&dHay(d).indexOf(QS)<0)return false;
  return true;
}
const rows=()=>{
  const c=COLS.find(x=>x.k===sortK)||COLS[0];
  return DB.filter(matchProf).sort((a,b)=>{
    const x=c.s(a),y=c.s(b);
    return (x<y?-1:x>y?1:0)*sortD || (a.n<b.n?-1:1);});
};

const COLS=[
 {k:"n",   t:"教授",         s:d=>d.n,
  c:d=>`<div class="nm">${esc(d.n)}</div><div class="dt nw">${esc(d.title)}</div>`},
 {k:"sch", t:"学校",         s:d=>"sftp".indexOf(d.sch),
  c:d=>`<span class="dt nw">${dotOf(d.sch)}${SCH[d.sch].g}</span>`},
 {k:"dept",t:"院系",         s:d=>d.dept, c:d=>`<span class="dt">${esc(d.dept)}</span>`},
 {k:"research",t:"研究方向", s:d=>d.research,
  c:d=>`<div class="rs">${esc(d.research)}</div>`
      +(d.honor?`<div class="dt" style="margin-top:2px">${esc(d.honor)}</div>`:"")},
 {k:"status",t:"状态",       s:d=>SGRP[d.status], c:d=>badge(d)},
 {k:"score",t:"可能性",      s:d=>d.score, c:d=>meter(d.score)},
 {k:"co",  t:"公司 / 轮次",  s:d=>d.cos.length?d.cos[0].name:"￿",
  c:d=>d.cos.length?`<div class="cc">`+d.cos.map(c=>
       `<div><span class="cn">${esc(c.name)}</span>`
      +(c.stage?` <span class="dt nw">${esc(c.stage)}</span>`:"")
      +`<div class="dt">${esc(c.role)}</div></div>`).join("")+`</div>`
     :`<span style="color:var(--faint)">—</span>`},
 {k:"email",t:"联系方式",    s:d=>d.email||d.home||"￿", c:d=>`<div class="em">${mailCell(d)}</div>`},
];

function renderTable(){
  /* innerHTML 整体重建会销毁当前获得焦点的 tr / 排序按钮，焦点掉回 body，
     键盘用户排完一次序就没法再按第二次。渲染前后自己接住焦点。 */
  const ae=document.activeElement, inTw=ae&&$("#tw").contains(ae);
  const keep=!inTw?null
    :(ae.closest("button.sb[data-k]")?{sb:ae.closest("button.sb").dataset.k}
    :(ae.closest("tr[data-p]")?{tr:ae.closest("tr[data-p]").dataset.p}:null));
  const rs=rows();
  $("#tcount").textContent=rs.length+" / "+DB.length+" 人";
  if(!rs.length){$("#tw").innerHTML=`<div class="empty">没有符合当前筛选的教授。</div>`;return;}
  const cols=COLS.map((c,i)=>`<col class="c${i+1}">`).join("");
  /* 不要给 th 加 role="button"：那会顶掉 columnheader 语义，aria-sort 随之失效。
     排序交互用内部的 <button> 承载。 */
  const head=COLS.map(c=>`<th data-k="${c.k}" scope="col"
      aria-sort="${sortK===c.k?(sortD>0?"ascending":"descending"):"none"}"><button type="button"
      class="sb" data-k="${c.k}">${c.t}${
      sortK===c.k?`<span class="ar">${sortD>0?"↑":"↓"}</span>`:""}</button></th>`).join("");
  const body=rs.map(d=>`<tr data-p="${esc(d._id)}" tabindex="0"${
      (d._edited||d._added)?' data-mod="1"':""}${
      sel&&sel.type==="prof"&&sel.d===d?' aria-current="true"':""}>`
     +COLS.map(c=>`<td>${c.c(d)}</td>`).join("")+`</tr>`).join("");
  $("#tw").innerHTML=`<table class="t"><colgroup>${cols}</colgroup>`
    +`<thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  if(keep){
    const el=keep.sb?$(`#tw th button.sb[data-k="${keep.sb}"]`)
      :$$("#tw tr[data-p]").find(t=>t.dataset.p===keep.tr);
    if(el)el.focus({preventScroll:true});
  }
}

   <article class="cd" data-p="${esc(d._id)}" tabindex="0" role="button" aria-label="${esc(d.n)}，查看与编辑">

   </article>`).join("")+`</div>`;
}

function setView(v){
  view=v; $("#sw").dataset.view=v; recompute();   /* 便宜，且免掉一整类筛选态不同步 */
  /* 图用 hits 高亮、表/卡用 QS 过滤，切视图时必须把对方的搜索态重算一遍，
     否则会拿上一次查询的结果画图 */
  if(v==="net")runSearch($("#q").value); else QS=norm($("#q").value);
  $$("#bar2 .chip[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v?"true":"false"));
  $("#stage").hidden=v!=="net"; $("#hint").hidden=v!=="net";
  $("#tvw").hidden=v!=="tbl"; $("#cvw").hidden=v!=="card";
  $$("#bar .gonly").forEach(b=>{b.style.display=v==="net"?"":"none";});
  if(v==="net"){if(!LAID){G.sch=fSch==="all"?null:fSch;G.dept=fDept;buildGraph();layout();recompute();}resize();kick();renderCrumb();}
  else if(v==="tbl")renderTable(); else renderCards();
  const box=$(v==="net"?"#stage":v==="tbl"?"#tvw":"#cvw");
  box.classList.remove("vin"); void box.offsetWidth; box.classList.add("vin");
}
function refresh(){ if(view==="net"){fit();draw();} else if(view==="tbl")renderTable(); else renderCards(); }

const row=(k,v)=>`<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`;
/* a name that maps onto a node in the graph becomes a jump target */
const exists=id=>id.startsWith("S:")?!!SCH[id.slice(2)]:id.startsWith("D:")?true
  :id.startsWith("I:")?INVM.has(id.slice(2)):DB.some(x=>x._id===id);
const lk=(id,txt,bold)=>exists(id)
  ?`<a class="lk" data-go="${esc(id)}" role="button" tabindex="0">${bold?"<b>"+esc(txt)+"</b>":esc(txt)}</a>`
  :(bold?"<b>"+esc(txt)+"</b>":esc(txt));
function coCard(d,c){
  const co=CO.get(c.name)||{schools:[d.sch],inv:c.inv||[]};
  const iv=c.inv&&c.inv.length?c.inv:(co.inv||[]);
  return `<div class="co"><div class="cn">${esc(c.name)}${c.stage?` <span class="cr">${esc(c.stage)}</span>`:""}</div>
    <div class="cr">${esc(c.role)}　·　${FLD[d.fld]}${c.born?"　·　"+esc(c.born)+" 成立":""}${
      co.schools&&co.schools.length>1?'　·　<b>两校共创</b>':''}</div>
    <div class="cf">${esc(c.fin||"公开报道未披露具体轮次")}</div>
    <div class="ci">投资方：${iv.length?iv.map(x=>{const v=byId.get("I:"+x);
      return lk("I:"+x, v&&v.cross?x+"·"+v.schools.length+"校":x, !!(v&&v.cross));}).join("、")
      :"未点名"}</div></div>`;
}
function profBody(d){
  let h=`<div class="sb">${esc(d.title)}　·　${esc(d.dept)}　·　${lk("S:"+d.sch,SCH[d.sch].n)}</div>`;
  h+=`<div class="pt">${badge(d)}<span style="flex:1"></span>${meter(d.score)}</div>`;
  h+=row("所属",`${lk("S:"+d.sch,SCH[d.sch].n)} › ${lk("D:"+DEPT(d),DEPT(d))}${d.grp?" › "+esc(d.grp):""}`
    +(d.lead?`<div class="sub">${esc(d.lead)}</div>`:""));
  h+=row("方向",esc(d.research));
  if(d.honor)h+=row("履历",esc(d.honor));
  if(d.email||d.home)h+=row("联系",mailCell(d));
  d.cos.forEach(c=>{h+=coCard(d,c);});
  if(!d.cos.length)h+=`<div class="co"><div class="cr">${
    d.status==="stealth"?"水下项目：有项目但尚无融资新闻，公司信息待补。":"尚无公司，列为待创业候选。"}</div></div>`;
  /* 同门：同研究所（没有研究所则同学院）的其他人，点名字直接换卡片 */
  const peers=DB.filter(x=>x!==d&&x.sch===d.sch&&DEPT(x)===DEPT(d)&&(d.grp?x.grp===d.grp:!x.grp));
  if(peers.length)h+=row(d.grp?"同所":"同院",`<span class="peers">`+peers.slice(0,40).map(x=>
    `<a class="lk" data-open="${esc(x._id)}" role="button" tabindex="0">${esc(x.n)}</a>`).join("、")
    +(peers.length>40?`　等 ${peers.length} 人`:"")+`</span>`);
  if(d.why)h+=row("判断",esc(d.why));
  if(d.note)h+=row("口径",`<b>${esc(d.note)}</b>`);
  h+=row("来源",esc(d.src||"本系列四校扫描报告"));
  return h;
}

/* 网络图不再有侧栏：点节点直接开全屏卡片，选中态只画在图上。
   showPanel 留作空函数，免得改动十几个调用点。 */
function showPanel(){}
function nodeBody(n){
  let h="";
  if(n.type==="dept"||n.type==="grp"){
    const ms=n.members||[];
    h+=`<div class="sb">${SCH[n.sch].n}${n.type==="grp"?" › "+esc(G.dept||""):""}${n.lead?"　·　"+esc(n.lead):""}</div>`;
    h+=row("规模",`${ms.length} 人 · 成长期 ${n.cnt.growth} · 创业 ${n.cnt.founded} · 高潜力 ${n.cnt.hot}`);
    const grp=new Map(); ms.forEach(d=>{const k=d.grp||"";if(!grp.has(k))grp.set(k,[]);grp.get(k).push(d);});
    [...grp.entries()].sort((a,b)=>b[1].length-a[1].length).forEach(([g,list])=>{
      h+=row(g?esc(g).slice(0,6):"成员",list.map(d=>`<a class="lk" data-open="${esc(d._id)}" role="button" tabindex="0">${esc(d.n)}</a>`
        +(HASCO(d.status)?'<span class="st founded" style="margin-left:3px;font-size:9.5px">创</span>':"")
        +(d.hot?'<span class="st hot" style="font-size:9.5px">潜</span>':"")).join("、"));});
    return h;
  }
  if(n.type==="inv"){
    const tags=[n.four?"通吃四校":(n.cross?"跨校 "+n.schools.map(k=>SCH[k].g).join("／"):"单校"),
      n.fund?"校属基金":null,n.corp?"产业资本":null,n.state?"国资":null,
      n.repeat?"连续出手 "+n.cos.length+" 次":null].filter(Boolean);
    h+=`<div class="sb">${tags.join("　·　")}</div>`;
    h+=row("投过",n.cos.map(c=>`${esc(c.name)}<span style="color:${SV[c.schools[0]]};font-size:11px"> ${c.schools.map(k=>SCH[k].g).join("")}</span>`
      +`<br><span style="font-size:11.5px;color:var(--muted)">└ `
      +c.profs.map(f=>lk(f.id,f.n)).join("、")+`</span>`).join("<br>"));
    if(n.alsoCo)h+=row("注","该机构本身也是本图中一位教授的公司："
      +n.alsoCo.profs.map(f=>lk(f.id,f.n)).join("、"));
  }else{
    const ds=DB.filter(d=>d.sch===n.sch);
    h+=`<div class="sb">收录 ${ds.length} 人　·　高潜力 ${ds.filter(d=>d.hot).length} 位</div>`;
    h+=row("学院",[...DEPTS(n.sch).entries()].map(([k,l])=>lk("D:"+k,k+" "+l.length)).join("、"));

  }

const pick=(mx,my)=>{let best=null,bd=1e9;
  N.forEach(n=>{if(!vis(n))return;const dx=SX(n)-mx,dy=SY(n)-my,d=dx*dx+dy*dy,rr=(rad(n)+7)**2;
    if(d<rr&&d<bd){bd=d;best=n;}});return best;};
const tipText=n=>n.type==="prof"?n.lab+" · "+SCH[n.sch].g+" · "+(n.d.cos.length
    ?n.d.cos.map(c=>c.name).join("／"):STAT[n.d.status])
  :(n.type==="dept"||n.type==="grp"||n.type==="school")?n.lab+" · "+n.cnt.n+" 人"+((n.cnt.growth+n.cnt.founded)?" · 创业 "+(n.cnt.growth+n.cnt.founded):"")+(n.lead?" · "+n.lead:"")
  :(n.type==="inv"?n.lab+" · 投过 "+n.cos.length+" 家":n.lab);
cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){
    if(press&&Math.abs(mx-press.mx)+Math.abs(my-press.my)>6)press.moved=true;
    drag.px=(mx-ox)/scale;drag.py=(my-oy)/scale;drag.pin=1;kick();return;}
  if(pan){ox=pan.ox+(mx-pan.mx);oy=pan.oy+(my-pan.my);
    if(Math.abs(mx-pan.mx)+Math.abs(my-pan.my)>3)pan.moved=true;
    userView=true;tip.style.opacity=0;draw();return;}
  const n=pick(mx,my);
  if(n!==hover){hover=n;draw();}
  if(n){tip.style.opacity=1;tip.textContent=tipText(n);
    tip.style.left=Math.max(4,Math.min(mx+13,r.width-tip.offsetWidth-6))+"px";tip.style.top=(my+14)+"px";}
  else tip.style.opacity=0;});
cv.addEventListener("pointerleave",()=>{hover=null;tip.style.opacity=0;draw();});
cv.addEventListener("pointerdown",e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const n=pick(mx,my);
  cv.focus({preventScroll:true});
  cv.setPointerCapture(e.pointerId);
  if(n){sel=n;drag=n;press={n,mx,my,moved:false};}
  else{pan={mx,my,ox,oy,moved:false};tip.style.opacity=0;}
  cv.classList.add("drag");draw();});
const endPointer=()=>{
  if(drag){drag.pin=0;drag=null;
    if(press&&!press.moved){tip.style.opacity=0;openNode(press.n);}}   /* 纯点击 → 全屏卡片 */
  press=null;
  if(pan){if(!pan.moved){sel=null;draw();}pan=null;}
  cv.classList.remove("drag");};
cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",endPointer);
cv.addEventListener("wheel",e=>{e.preventDefault();
  const r=cv.getBoundingClientRect();
  const d=e.deltaY*(e.deltaMode===1?16:(e.deltaMode===2?H:1));
  zoomAt(e.clientX-r.left,e.clientY-r.top,Math.pow(.9986,d));},{passive:false});
cv.addEventListener("dblclick",e=>{if(!pick(e.clientX-cv.getBoundingClientRect().left,
  e.clientY-cv.getBoundingClientRect().top)){fit();draw();}});

/* keyboard: the canvas is the only way into this graph, so it has to be reachable */
const DIR={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
cv.addEventListener("keydown",e=>{
  const k=e.key;
  if(k==="Escape"){if(MO.open)return;if(sel){sel=null;hover=null;draw();}else if(G.sch)drillUp();return;}
  if(k==="Backspace"){if(MO.open)return;e.preventDefault();if(G.sch)drillUp();return;}
  if(k==="Enter"&&sel){e.preventDefault();openNode(sel);return;}
  if(k==="0"){fit();draw();return;}
  const cx=(W-padR()+22)/2;                    /* 与工具条 ＋/− 同一个锚点 */
  if(k==="+"||k==="="){e.preventDefault();zoomAt(cx,H/2,1.25);return;}
  if(k==="-"||k==="_"){e.preventDefault();zoomAt(cx,H/2,1/1.25);return;}
  if(!DIR[k])return;
  e.preventDefault();
  if(!sel){const v=N.filter(vis); if(!v.length)return;
    sel=v.filter(n=>n.hub)[0]||v[0];nudgeIntoView(sel);draw();return;}
  const [dx,dy]=DIR[k];let best=null,bd=1e18;
  N.forEach(n=>{if(n===sel||!vis(n))return;
    const px=n.x-sel.x,py=n.y-sel.y;
    const along=px*dx+py*dy,off=Math.abs(px*dy-py*dx);
    if(along<=0)return;
    const c=along+off*2.4; if(c<bd){bd=c;best=n;}});
  if(best){sel=best;nudgeIntoView(best);draw();}});

let raf=null,alpha=0;
const kick=()=>{alpha=.9;if(!raf)raf=requestAnimationFrame(loop);};
function loop(){alpha*=.94;
  if(alpha>.02){step(alpha);draw();raf=requestAnimationFrame(loop);}
  else{step(.02);draw();raf=null;}}

function resize(){
  const r=cbox.getBoundingClientRect();
  /* a stage narrower than this is never a real layout — refuse to latch onto a
     degenerate measurement, keep the last good size and wait for the next pass */
  if(r.width<80||r.height<80)return;
  /* hold whatever the reader is looking at, so a tab-switch or window resize
     doesn't silently throw away their zoom */
  const keep=userView&&W>0, cx=keep?(W/2-ox)/scale:0, cy=keep?(H/2-oy)/scale:0;
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+"px";cv.style.height=H+"px";
  if(keep){const s=scale;fit();scale=s;ox=W/2-cx*s;oy=H/2-cy*s;userView=true;} else fit();
  draw();}
new ResizeObserver(resize).observe(cbox);
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",resize);
new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))resize();}).observe(cbox);

/* ============ 页面内编辑：覆盖层 + 存储 + 全屏详情/编辑 ============
   思路：文件里的 DB0 永远是基线，页面内的增改作为「覆盖记录」单独存，
   每次变化都 = 基线 + 覆盖 → 重新 build。所以「重置为原始」永远可用，
   而且导出的 JSON 就是需要合回源文件的那部分，不会把整份数据抄一遍。

   存储后端：claude.ai 的 artifact db（同组织内共享、Claude 可读回）；
   不在 claude.ai 里打开时退回 localStorage（仅本浏览器）。 */
const LSK="sikao.prof.edits.v1";
const hid=s=>{let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return "p"+h.toString(16);};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const EDITABLE=["n","sch","dept","grp","lead","manual","title","email","home","research","honor","fld","status","hot","score","why","note","src","cos"];
const cleanRec=d=>{const r={};EDITABLE.forEach(k=>{if(d[k]!==undefined&&d[k]!==""&&!(k==="hot"&&!d[k]))r[k]=clone(d[k]);});
  r.cos=(r.cos||[]).filter(c=>c&&c.name).map(c=>{const o={name:c.name,role:c.role||""};
    ["born","stage","fin"].forEach(k=>{if(c[k])o[k]=c[k];}); if(c.inv&&c.inv.length)o.inv=c.inv; return o;});
  if(!r.cos.length)delete r.cos; return r;};

const store={
  mode:"none", map:new Map(), db:null, sig:"",
  async init(){
    let db=null;
    try{ if(window.claude&&typeof window.claude.use==="function") db=await window.claude.use("db"); }catch(e){}
    if(db){
      this.db=db; this.mode="db";
      db.collection("profs").onSnapshot(snap=>{
        this.map=new Map(snap.docs.filter(x=>x.exists).map(x=>[x.id,x.data()]));
        this.changed();
      },err=>{ console.warn("[存储] db 订阅失败，退回本浏览器存储：",err&&err.code); this.fallback(); });
    } else this.fallback();
    setSync();
  },
  fallback(){ this.mode="local"; this.loadLocal(); this.changed(); setSync(); },
  loadLocal(){ try{const j=JSON.parse(localStorage.getItem(LSK)||"{}");this.map=new Map(Object.entries(j));}catch(e){this.map=new Map();} },
  saveLocal(){ try{localStorage.setItem(LSK,JSON.stringify(Object.fromEntries(this.map)));}catch(e){} },
  changed(){ const s=JSON.stringify([...this.map.entries()].sort()); if(s===this.sig)return; this.sig=s; overlayAndRebuild(); },
  async put(id,body){
    this.map.set(id,body); this.changed();
    if(this.mode==="db"){ try{await this.db.doc("profs/"+id).set(body);}
      catch(e){ toast("云端保存失败（"+(e&&e.code||"unknown")+"），已暂存本浏览器"); this.saveLocal(); } }
    else this.saveLocal();
  },
  async remove(id){
    this.map.delete(id); this.changed();
    if(this.mode==="db"){ try{await this.db.doc("profs/"+id).delete();}catch(e){toast("云端删除失败："+(e&&e.code||"unknown"));} }
    else this.saveLocal();
  },
  count(){ return this.map.size; }
};
function setSync(){
  const el=$("#sync"); if(!el)return;
  const n=store.count();
  el.textContent=store.mode==="db"?("已同步"+(n?" · "+n+" 处修改":"")):
    store.mode==="local"?("仅存本浏览器"+(n?" · "+n+" 处修改":"")):"";
  el.title=store.mode==="db"?"增改保存在 claude.ai，同组织内可见":
    "不在 claude.ai 里打开，增改只保存在这个浏览器的 localStorage";
  el.classList.toggle("local",store.mode==="local");
}

/* 覆盖层：基线 + 覆盖记录 → DB，再重建图 */
function overlayAndRebuild(){
  const base=DB0.map(clone); assignIds(base);
  const adds=[];
  store.map.forEach((body,docid)=>{
    if(!body||!body.rec)return;
    if(body.kind==="edit"){ const t=base.find(x=>x._id===body.key);
      if(t){ EDITABLE.forEach(k=>{delete t[k];}); Object.assign(t,body.rec); t._id=body.key; t._edited=1; } }
    else if(body.kind==="add"){ const r=Object.assign({},body.rec); r._id="N:"+(body.uid||docid); r._added=1; adds.push(r); }
  });
  DB=base.concat(adds);
  DB.forEach(d=>{d.cos=d.cos||[]; d.hot=d.hot?1:0; if(d.score==null)d.score=HASCO(d.status)?5:3;});
  rebuild(); setSync();
}

  const selId=sel&&sel.id;
  build(); renderDeptSel();
  if(view==="net"){buildGraph();layout();recompute();sel=selId?(byId.get(selId)||null):null;hover=null;drag=null;pan=null;
    if(!userView)fit(); draw(); renderCrumb();}
  else{LAID=false;sel=null;hover=null;refresh();}
  showPanel(sel);
  if(MO.open&&MO.d){ const d=DB.find(x=>x._id===MO.d._id); if(d&&MO.mode==="view"){MO.d=d;renderModal();} }
}

      ${inp("co.born","成立时间",c.born,"如 2023.11")}
      ${inp("co.stage","最新轮次",c.stage,"如 Pre-A+ / B 轮 / 已上市")}
      ${ta("co.fin","融资情况",c.fin,"逐轮写，含金额与领投方",2)}
      ${ta("co.inv","投资方（用「、」或逗号分隔）",(c.inv||[]).join("、"),"红杉中国、高瓴",1)}
    </div></div>`;
}
function editForm(d){
  const nw=isNew(d);
  return `<form id="ed" class="ed" autocomplete="off" novalidate>
    <div class="ed-sec">基本信息</div>
    <div class="grid">
      ${nw?inp("n","姓名 *",d.n,"必填"):`<label class="f"><span>姓名</span><input value="${esc(d.n)}" disabled title="基线记录的姓名不可改（它是记录的 id）"></label>`}
      ${nw?sel_("sch","学校 *",Object.keys(SCH).map(k=>[k,SCH[k].n]),d.sch)
          :`<label class="f"><span>学校</span><input value="${esc(SCH[d.sch].n)}" disabled></label>`}
      ${inp("dept","院系 *",d.dept,"如 人工智能学院")}
      ${inp("title","职称 *",d.title,"如 长聘副教授")}
      ${inp("email","职务邮箱",d.email,"只收院系官网公开的职务邮箱","email")}
      ${inp("home","个人主页",d.home,"https://…","url")}
      ${ta("research","研究方向 *",d.research,"20-60 字",2)}
      ${ta("honor","荣誉履历",d.honor,"如 长江学者 · 原 Google X",1)}
    </div>
    <div class="ed-sec">标签</div>
    <div class="grid">
      ${sel_("fld","赛道 *",Object.keys(FLD).map(k=>[k,FLD[k]]),d.fld)}
      ${sel_("status","状态 *",[["growth","成长期项目（B 轮以后）"],["founded","创业项目（B 轮及之前，有融资新闻）"],["stealth","水下项目（有项目，无融资新闻）"],["potential","待创业"]],d.status)}
      ${sel_("score","创业可能性",[1,2,3,4,5].map(i=>[String(i),i+" / 5"+(i===5?"（已创业固定 5）":"")]),String(d.score||3))}
      <label class="f chk"><input type="checkbox" name="hot"${d.hot?" checked":""}><span>高潜力（值得优先接触）</span></label>
      ${ta("why","判断依据",d.why,"评分的事实依据，一句话",2)}
      ${ta("note","口径备注",d.note,"冲突 / 待核实 / 身份陷阱",2)}
      ${inp("src","来源",d.src,"如 手动补录 2026-09")}
    </div>
    <div class="ed-sec">公司 <span class="ed-hint">待创业者留空；标了「创业项目」至少要有一家</span></div>
    <div id="cos">${(d.cos||[]).map(coEditor).join("")}</div>
    <button type="button" class="chip" id="addco">＋ 添加公司</button>
    <div class="ed-err" id="ed-err" role="alert"></div>
  </form>`;
}
/* 表单 → 记录（不改 DOM，只读） */
function readForm(){
  const f=$("#ed"), d=clone(MO.draft);
  const g=k=>{const el=f.querySelector(`[name="${k}"]`);return el?el.value.trim():undefined;};
  ["n","sch","dept","title","email","home","research","honor","fld","status","why","note","src"].forEach(k=>{
    const v=g(k); if(v!==undefined)d[k]=v;});
  d.score=+g("score")||3; d.hot=f.querySelector('[name="hot"]').checked?1:0;
  d.cos=$$("#cos .co-ed").map(box=>{
    const q=k=>box.querySelector(`[name="co.${k}"]`).value.trim();
    return {name:q("name"),role:q("role"),born:q("born"),stage:q("stage"),fin:q("fin"),
      inv:q("inv").split(/[、,，;；\n]+/).map(x=>x.trim()).filter(Boolean)};
  }).filter(c=>c.name||c.role||c.fin);
  if(HASCO(d.status))d.score=5;
  return d;
}
async function saveDraft(){
  const d=readForm(); const err=checkRec(d);
  if(isNew(d)&&DB.some(x=>x!==MO.d&&x.sch===d.sch&&x.n===d.n&&!x._added))err.unshift("基线里已有同校同名的「"+d.n+"」，请直接编辑那一条");
  const box=$("#ed-err");
  if(err.length){box.innerHTML="<b>还不能保存：</b>"+err.map(esc).join("；");box.scrollIntoView({block:"nearest"});return;}
  d.manual=1;                       /* 人改过的记录：脚本重跑时不得重算状态与高潜力 */
  const rec=cleanRec(d);
  if(isNew(MO.d)){
    const u=(MO.d._id&&MO.d._id.indexOf("N:")===0)?MO.d._id.slice(2):uid();
    await store.put("n"+u,{kind:"add",uid:u,at:new Date().toISOString(),rec});
    MO.d=DB.find(x=>x._id==="N:"+u)||MO.d;
  }else{
    await store.put(hid(MO.d._id),{kind:"edit",key:MO.d._id,at:new Date().toISOString(),rec});
    MO.d=DB.find(x=>x._id===MO.d._id)||MO.d;
  }
  MO.mode="view"; MO.draft=null; renderModal(); moBd.scrollTop=0; toast("已保存");
}
async function quickSet(d,patch){
  const next=Object.assign(clone(d),patch);
  if(HASCO(next.status)&&!(next.cos||[]).length){toast("标成创业/成长期项目前先在编辑里加一家公司");return;}
  if(next.status==="potential"&&(next.cos||[]).length){toast("挂着公司的人不能标「待创业」，可改为「水下项目」");return;}
  if(HASCO(next.status))next.score=5;
  next.manual=1;                    /* 同上 */
  const rec=cleanRec(next);
  if(isNew(d)) await store.put("n"+d._id.slice(2),{kind:"add",uid:d._id.slice(2),at:new Date().toISOString(),rec});
  else await store.put(hid(d._id),{kind:"edit",key:d._id,at:new Date().toISOString(),rec});
  const nd=DB.find(x=>x._id===d._id); if(nd){MO.d=nd;renderModal();}
  toast("已保存");
}
mo.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-close]")||t.closest("#mo-x")){closeModal();return;}
  if(t.closest("#mo-edit")){MO.mode="edit";MO.draft=clone(MO.d);renderModal();moBd.scrollTop=0;const f=$("#ed input:not([disabled])");if(f)f.focus();return;}
  if(t.closest("#mo-cancel")){
    if(isNew(MO.d)&&!MO.d._id){closeModal();return;}   /* 新建未保存 → 直接关 */
    MO.mode="view";MO.draft=null;renderModal();moBd.scrollTop=0;return;}
  if(t.closest("#mo-save")){saveDraft();return;}
  if(t.closest("#mo-reset")){ if(confirm("删掉页面内对「"+MO.d.n+"」的修改，回到源文件里的版本？")){
      const id=MO.d._id; await store.remove(hid(id)); MO.d=DB.find(x=>x._id===id)||MO.d; MO.mode="view";MO.draft=null;renderModal(); toast("已重置"); } return;}
  if(t.closest("#mo-del")){ if(confirm("删掉页面内添加的「"+MO.d.n+"」？")){
      await store.remove("n"+MO.d._id.slice(2)); closeModal(); toast("已删除"); } return;}
  if(t.closest("#mo-graph")){const id=MO.d._id;closeModal();goToId(id);return;}
  if(t.closest("#addco")){ const box=$("#cos"); box.insertAdjacentHTML("beforeend",coEditor({},box.children.length));
    const f=box.lastElementChild.querySelector("input"); if(f)f.focus(); return;}
  const dc=t.closest("[data-delco]"); if(dc){dc.closest(".co-ed").remove();$$("#cos .co-ed").forEach((b,i)=>{b.dataset.i=i;b.querySelector("b").textContent="公司 "+(i+1);});return;}
  const sg=t.closest("[data-seg]");
  if(sg&&MO.mode==="view"){
    const k=sg.dataset.seg;
    if(k==="hot")quickSet(MO.d,{hot:MO.d.hot?0:1});
    else if(k==="score")quickSet(MO.d,{score:+sg.dataset.v});
    else if(k==="status")quickSet(MO.d,{status:sg.dataset.v});
    return;}
  const cp=t.closest("[data-cp]"); if(cp){copy(cp.dataset.cp,"邮箱已复制");return;}
  const go=t.closest("[data-go]"); if(go){const id=go.dataset.go;closeModal();goToId(id);return;}
  const op=t.closest("[data-open]"); if(op){const d=DB.find(x=>x._id===op.dataset.open);if(d){MO.node=null;MO.d=d;MO.mode="view";MO.draft=null;renderModal();moBd.scrollTop=0;}return;}
});
mo.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const el=e.target.closest("[data-open],[data-go]"); if(!el)return;
  e.preventDefault(); el.click();});
mo.addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.stopPropagation();if(MO.mode==="edit"&&!confirm("放弃未保存的修改？"))return;closeModal();return;}
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&MO.mode==="edit"){e.preventDefault();saveDraft();}
  /* 焦点留在弹层里：Tab 到头回到第一个，Shift+Tab 到头去最后一个 */
  if(e.key==="Tab"){
    const fs=$$("#mo button:not([disabled]),#mo input:not([disabled]),#mo select,#mo textarea,#mo a[href],#mo [tabindex='0']")
      .filter(x=>x.offsetParent!==null);
    if(!fs.length)return;
    const first=fs[0],last=fs[fs.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

});

$("#tcopy").addEventListener("click",()=>{
  const rs=rows();
  const head=["姓名","学校","院系","职称","研究方向","荣誉履历","赛道","状态","高潜力",
    "创业可能性","公司","角色","成立","最新轮次","融资情况","投资方","邮箱","主页","判断依据","口径","来源"];
  const cell=v=>String(v==null?"":v).replace(/[\t\r\n]+/g," ");
  const out=[head.join("\t")].concat(rs.flatMap(d=>{
    const base=[d.n,SCH[d.sch].n,d.dept,d.title,d.research,d.honor||"",FLD[d.fld],
      STAT[d.status],d.hot?"是":"",d.score];
    const tailc=[d.why||"",d.note||"",d.src||""];
    return d.cos.length?d.cos.map(c=>base.concat(
        [c.name,c.role,c.born||"",c.stage||"",c.fin||"",(c.inv||[]).join("、")],
        [d.email||"",d.home||""],tailc).map(cell).join("\t"))
      :[base.concat(["","","","","",""],[d.email||"",d.home||""],tailc).map(cell).join("\t")];}));
  copy(out.join("\n"),rs.length+" 人已复制为表格，可直接粘进 Excel / 飞书 / Notion");});
